# Builds SimpleCrosshair.exe when a version tag (v*) is pushed, signs it with Azure Artifact
# Signing, and publishes it as a GitHub Release together with SHA256SUMS.txt.
#
# The exe is attached exactly as the compiler produced it (plus the signature): no UPX or any
# other packer, since packed executables are a common antivirus false-positive trigger.
#
# Signing setup (SIGNING.md): a "signing" environment, limited to v* tags, holding the secrets
# AZURE_CLIENT_ID and AZURE_TENANT_ID for an Entra app that may sign. It signs in to Azure with
# OIDC, so no password or client secret is stored anywhere.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # needed to create the release and upload assets
  id-token: write  # needed to sign in to Azure with OIDC

jobs:
  release:
    runs-on: windows-latest
    environment: signing
    steps:
      - uses: actions/checkout@v4

      # Use the runner's preinstalled MSYS2 and add the UCRT64 MinGW-w64 toolchain (g++, windres).
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build
        shell: cmd
        run: |
          set PATH=C:\msys64\ucrt64\bin;%PATH%
          g++ --version
          call build.bat

      # Signing must happen before the checksums, so SHA256SUMS.txt matches the signed exe.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x  # Microsoft's signing client runs on .NET 10

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Sign
        shell: pwsh
        run: ./sign.ps1 SimpleCrosshair.exe

      - name: Write SHA256SUMS.txt
        shell: pwsh
        run: |
          $hash = (Get-FileHash SimpleCrosshair.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("SHA256SUMS.txt", "$hash  SimpleCrosshair.exe`n")
          Get-Content SHA256SUMS.txt

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag SimpleCrosshair.exe SHA256SUMS.txt --clobber
          } else {
            gh release create $tag SimpleCrosshair.exe SHA256SUMS.txt --title $tag --generate-notes
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
